# Publishes @seeghra/tokens to npm every time a GitHub release is published.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing needs npm 11.5.1 or newer, which ships with Node 24.
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Check the build matches the committed files
        run: git diff --exit-code dist docs
      # No token: npm checks this workflow against the package's Trusted Publisher setting.
      - run: npm publish --access public --provenance
